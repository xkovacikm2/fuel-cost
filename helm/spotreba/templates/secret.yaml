apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spotreba.fullname" . }}
  labels:
    {{- include "spotreba.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-secret-key: {{ required "app.secretKey is required" .Values.app.secretKey | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- if .Values.app.smtp.enabled }}
  smtp-password: {{ required "app.smtp.password is required when SMTP is enabled" .Values.app.smtp.password | quote }}
  {{- end }}
