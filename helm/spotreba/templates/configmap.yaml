apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spotreba.fullname" . }}
  labels:
    {{- include "spotreba.labels" . | nindent 4 }}
data:
  APP_ENV: production
  PORT: {{ .Values.app.port | quote }}
  APP_HOST: {{ .Values.app.host | quote }}
  APP_TZ: {{ .Values.app.timeZone | quote }}
  ASSUME_SSL: {{ .Values.app.assumeSsl | quote }}
  TRUSTED_PROXY_CIDRS: {{ join "," .Values.app.trustedProxyCIDRs | quote }}
  MAILER_FROM: {{ .Values.app.mailerFrom | quote }}
  {{- if .Values.app.smtp.enabled }}
  SMTP_ADDRESS: {{ required "app.smtp.address is required when SMTP is enabled" .Values.app.smtp.address | quote }}
  SMTP_PORT: {{ .Values.app.smtp.port | quote }}
  SMTP_USERNAME: {{ .Values.app.smtp.username | quote }}
  {{- end }}
