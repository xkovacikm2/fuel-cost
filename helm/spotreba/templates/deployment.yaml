apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spotreba.fullname" . }}
  labels:
    {{- include "spotreba.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rails.replicaCount }}
  selector:
    matchLabels:
      {{- include "spotreba.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "spotreba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "spotreba.postgresqlHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: db-migrate
          image: "{{ .Values.rails.image.repository }}:{{ .Values.rails.image.tag }}"
          imagePullPolicy: {{ .Values.rails.image.pullPolicy }}
          command:
            - bin/rails
            - db:prepare
          envFrom:
            - configMapRef:
                name: {{ include "spotreba.fullname" . }}
          env:
            - name: SPOTREBA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: postgres-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: rails-secret-key-base
            {{- if .Values.rails.smtp.enabled }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: smtp-password
            {{- end }}
      containers:
        - name: rails
          image: "{{ .Values.rails.image.repository }}:{{ .Values.rails.image.tag }}"
          imagePullPolicy: {{ .Values.rails.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "spotreba.fullname" . }}
          env:
            - name: SPOTREBA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: postgres-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: rails-secret-key-base
            {{- if .Values.rails.smtp.enabled }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: smtp-password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.rails.resources | nindent 12 }}
