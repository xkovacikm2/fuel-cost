apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spotreba.fullname" . }}
  labels:
    {{- include "spotreba.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "spotreba.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "spotreba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "spotreba.postgresqlHost" . }} 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: db-migrate
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["/spotreba", "migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "spotreba.fullname" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "spotreba.databaseUrl" . | quote }}
      containers:
        - name: spotreba
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "spotreba.fullname" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "spotreba.databaseUrl" . | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: app-secret-key
            {{- if .Values.app.smtp.enabled }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotreba.fullname" . }}
                  key: smtp-password
            {{- end }}
          readinessProbe:
            httpGet:
              path: /up
              port: http
          livenessProbe:
            httpGet:
              path: /up
              port: http
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
