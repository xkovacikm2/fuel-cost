# Go application configuration
app:
  replicaCount: 1
  image:
    repository: hocikto19/spotreba
    tag: latest
    pullPolicy: IfNotPresent

  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Set true when TLS is terminated upstream and the app receives plain HTTP.
  assumeSsl: false
  secretKey: ""
  host: spotreba.example.com
  timeZone: Europe/Bratislava
  trustedProxyCIDRs: []
  mailerFrom: "from@example.com"
  smtp:
    enabled: false
    username: ""
    password: ""
    address: ""
    port: 587
  reminders:
    schedule: "0 8 * * *"
    timeZone: Europe/Bratislava

# PostgreSQL database configuration
postgresql:
  enabled: true
  
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  
  auth:
    database: spotreba_production
    username: spotreba
    password: ""
  
  storage:
    size: 10Gi
    storageClassName: ""
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Ingress configuration (Traefik IngressRoute CRD)
ingress:
  enabled: true
  # Serve HTTP only, overriding TLS and disabling the HTTPS redirect
  httpOnly: false
  hostname: spotreba.example.com
  # TLS configuration with cert-manager
  tls:
    enabled: false
    issuer: letsencrypt-prod  # ClusterIssuer name
  # Optional: Add Traefik middlewares (e.g., for rate limiting, headers, etc.)
  # middlewares:
  #   - name: my-middleware
  #     namespace: default

# Service configuration
service:
  type: ClusterIP
  port: 8080

# WebEndpoint CRD configuration
webEndpoint:
  enabled: true
  name: "Spotreba Fuel Tracker"
  description: "Fuel consumption and cost tracker"
  url: "https://spotreba.example.com"
  icon: "https://spotreba.example.com/icon.png"