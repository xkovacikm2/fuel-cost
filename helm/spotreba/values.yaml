# Rails application configuration
rails:
  replicaCount: 1
  image:
    repository: hocikto19/spotreba
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Rails environment
  railsEnv: production
  
  # Secret key base for Rails (generate with: rails secret)
  secretKeyBase: ""

  # SMTP configuration for production mail delivery
  smtp:
    enabled: false
    username: ""
    password: ""
    address: ""
    port: 587
    authentication: plain
    enableStarttlsAuto: true

# PostgreSQL database configuration
postgresql:
  enabled: true
  
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  
  auth:
    database: spotreba_production
    username: spotreba
    password: ""
    postgresPassword: ""
  
  storage:
    size: 10Gi
    storageClassName: ""
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Ingress configuration (Traefik IngressRoute CRD)
ingress:
  enabled: true
  hostname: spotreba.example.com
  # TLS configuration with cert-manager
  tls:
    enabled: false
    issuer: letsencrypt-prod  # ClusterIssuer name
  # Optional: Add Traefik middlewares (e.g., for rate limiting, headers, etc.)
  # middlewares:
  #   - name: my-middleware
  #     namespace: default

# Service configuration
service:
  type: ClusterIP
  port: 3000

# WebEndpoint CRD configuration
webEndpoint:
  enabled: true
  name: "Spotreba Fuel Tracker"
  description: "Fuel consumption and cost tracker"
  url: "https://spotreba.example.com"
  icon: "https://spotreba.example.com/icon.png"