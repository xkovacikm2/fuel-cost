version: '3'

vars:
  TEST_DATABASE_URL: '{{.MIGRATION_TEST_DATABASE_URL | default "postgres://postgres:postgres@localhost:5432/spotreba_go_e2e?sslmode=disable"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  test:
    desc: Run the full test suite (Go, frontend, and E2E)
    aliases: [test:all]
    cmds:
      - task: test:go
      - task: test:frontend
      - task: test:e2e

  test:go:
    desc: Run Go backend and PostgreSQL migration tests
    dir: server
    env:
      MIGRATION_TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - task: build:frontend
      - go test ./... {{.CLI_ARGS}}

  test:frontend:
    desc: Run frontend unit tests
    dir: web
    cmds:
      - npm test -- {{.CLI_ARGS}}

  test:e2e:
    desc: Run E2E tests with an automatically managed test server
    dir: e2e
    env:
      E2E_START_SERVER: '1'
      E2E_DATABASE_URL: '{{.E2E_DATABASE_URL | default .TEST_DATABASE_URL}}'
    cmds:
      - task: build:frontend
      - npm test -- {{.CLI_ARGS}}

  build:frontend:
    internal: true
    dir: web
    run: once
    cmds:
      - npm run build
