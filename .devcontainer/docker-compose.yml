version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/workspace/spotreba:cached
    command: sleep infinity
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/spotreba_development?sslmode=disable
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/spotreba_go_e2e?sslmode=disable
      TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128
      SECRET_KEY: development-only-secret-key-change-me
      TZ: Europe/Bratislava
      APP_TZ: Europe/Bratislava
      APP_HOST: localhost:8080
      MAILER_FROM: spotreba@localhost
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      - db
      - mailpit
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotreba_development
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
